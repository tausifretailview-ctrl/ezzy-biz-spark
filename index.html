  <body>
    <div id="root"></div>
    <script>
      // The build prerenders public pages into #root (data-prerendered) so search
      // engines and AI crawlers see real content. When the SPA fallback serves
      // that HTML for a different route, drop it before it paints.
      (function () {
        var root = document.getElementById("root");
        var path = location.pathname.replace(/\/+$/, "") || "/";
        if (path === "/home") path = "/";
        if (root.dataset.prerendered && root.dataset.prerendered !== path) root.innerHTML = "";
      })();
    </script>
